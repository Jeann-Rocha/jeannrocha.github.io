<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador — Jeann Rocha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- ============================================================
       MathJax — configuração para reconhecer $...$ e $$...$$
       ============================================================ -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async id="MathJax-script"
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Jeann Rocha</a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="notas.html">Notas</a>
        <a href="monitorias.html" class="active">Monitorias</a>
        <a href="projetos.html">Projetos</a>
        <a href="contato.html">Contato</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="viewer-toolbar">
          <a href="javascript:history.back()" class="viewer-back">← Voltar</a>
        </div>

        <article id="markdown-content" class="markdown-body">
          <p class="viewer-loading">Carregando…</p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Jeann Rocha</p>
      <p class="footer-note"><a href="#top">Voltar ao topo ↑</a></p>
    </div>
  </footer>

  <!-- marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Lógica do visualizador -->
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const container = document.getElementById('markdown-content');

      const safePattern = /^[a-zA-Z0-9_\-\/\.%\s\(\)]+\.md$/;

      if (!file || !safePattern.test(file)) {
        container.innerHTML = '<p><strong>Arquivo não especificado ou inválido.</strong></p>';
        return;
      }

      const niceName = decodeURIComponent(file.split('/').pop().replace(/\.md$/, ''));
      document.title = niceName + ' — Jeann Rocha';

      // Função que, depois de renderizar o markdown, manda o MathJax processar
      function typesetMath() {
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([container]).catch(function (err) {
            console.warn('Erro no MathJax:', err);
          });
        } else {
          // MathJax ainda não carregou — espera e tenta de novo
          setTimeout(typesetMath, 200);
        }
      }

      fetch(file)
        .then(function (r) {
          if (!r.ok) throw new Error('Não foi possível carregar o arquivo (HTTP ' + r.status + ').');
          return r.text();
        })
        .then(function (text) {
          container.innerHTML = marked.parse(text);

          // Links externos abrem em nova aba
          container.querySelectorAll('a').forEach(function (a) {
            const href = a.getAttribute('href') || '';
            if (/^https?:\/\//.test(href)) {
              a.setAttribute('target', '_blank');
              a.setAttribute('rel', 'noopener');
            }
          });

          // Agora processa as fórmulas
          typesetMath();
        })
        .catch(function (err) {
          container.innerHTML = '<p><strong>Erro:</strong> ' + err.message + '</p>';
        });
    })();
  </script>

</body>
</html>
